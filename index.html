<main><section id="access"><noscript><div class="noscript"><img src="assets/brand/vzor-color.png" alt="VZOR" width="180"><h2>Acceso a la parrilla</h2><p>Activa JavaScript para ingresar con tu código personal.</p></div></noscript></section><section id="vote" class="hidden"></section><section id="results" class="hidden"></section></main>

<script>
'use strict';
// Configurar solo la URL PUBLICA de la Edge Function. NUNCA insertar claves secretas aqui.
const API_URL='https://qunaajvvtkuamgwmwnjw.supabase.co/functions/v1/kart-api';
let PARTICIPANTS=['Marcelo Ravilet','Nelson Aviles','Victor Lucero','Alfredo Aguirre','Claritza Tocuyo','Eric Aparicio','Francisco Tosso','Francisco Reyes','Jeremy Leiva','Daniel Cortez','Diego Inostroza','Matías Yáñez','Felipe Tapia','Luis Martínez','Félix Purves','Matías Hurtado','Erwin Chávez','Jorge Sepúlveda','Marcelo Rubilar'];

['Mario','','mario.png','Acepta todos los desafíos antes de preguntar de qué se tratan.'],
['Luigi','','luigi.png','Prefiere pasar desapercibido, pero siempre termina salvando el día.'],

['King Boo','','king-boo.png','Desaparece cuando lo buscan y aparece cuando menos lo esperan.'],
['Toadette','','toadette.png','Sabe dónde está hasta ese archivo que perdiste hace seis meses.'],

['Dry Bones','','dry-bones.png','Sobrevivió a tantas crisis que ya nada lo sorprende. Siempre vuelve.'],
['Funky Kong','','funky-kong.png','Siempre anda relajado, como si estuviera de vacaciones. Incluso en plena crisis parece que se está divirtiendo.'],
['Birdo','','birdo.png','Le encanta ser el centro de atención. Hasta para contar algo sencillo necesita una audiencia.'],
['Kamek','','kamek.png','Siempre tiene un truco bajo la manga. Nadie sabe cómo lo hizo, pero el problema desapareció.'],
['Petey Piranha','','petey-piranha.png','Ocupa todo el espacio disponible. Incluso intentando pasar desapercibido, es imposible.'],
['Wiggler','','wiggler.png','Es la persona más tranquila del mundo... hasta que alguien le cambia los planes.'],
['Pauline','','pauline.png','Tiene carisma de sobra. Puede transformar cualquier conversación en un espectáculo.'],
['Peachette','','peachette.png','Se adapta a cualquier situación. Cambia de plan y actúa como si siempre hubiera sido la idea original.']
];

const MAX_UPDATES=3;
let currentUser=null,code='',state=null,draft={},editing=false,admin=false,adminKey='',adminEmail='',finalData=null,modalPerson=null,priorFocus=null;
function syncParticipants(data){if(Array.isArray(data?.participants)&&data.participants.length===19&&data.participants.every(x=>typeof x==='string'&&x.trim()))PARTICIPANTS=data.participants.slice()}
function updateLimit(){return state?.record?.max_updates ?? MAX_UPDATES}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function art(index){const c=CHARACTERS[index];return `<img src="assets/characters/${c[2]}" alt="${esc(c[0])}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none">${esc(c[0])}</span>`}
async function api(action,payload={}){
 if(API_URL.startsWith('PEGAR_'))throw Error('Falta configurar API_URL en index.html para conectar Supabase.');
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
 try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload}),signal:controller.signal});let value=await r.json().catch(()=>({error:'Respuesta no válida del servidor'}));if(!r.ok||value.error)throw Error(value.error||'No se pudo procesar la solicitud');return value}finally{clearTimeout(timeout)}
}
function show(page){
 if(page==='results'&&!admin){openAdminAccess();return}
 // La papeleta requiere sesión de participante; administración tiene su propio acceso.
 if(currentUser===null && page==='vote')page='access';
 closeModal();
 document.body.classList.toggle('pre-auth',currentUser===null);
 document.body.classList.toggle('admin-access-page',currentUser===null&&page==='results');
 for(const id of ['access','vote','results']){
  document.getElementById(id).classList.toggle('hidden',id!==page);
  document.getElementById('tab-'+id).setAttribute('aria-current',id===page?'page':'false');
 }
 ({access:renderAccess,vote:renderVote,results:renderResults})[page]();
}
function eventBriefing(){return `
<div class="access-hero"><div class="briefing-copy">
<h2>Antes de encender los motores… hay que descubrir quién es quién.</h2>
<p class="access-lead">Este 18 de diciembre, VZOR® cambia las reuniones por una pista de karting. Antes de la largada tenemos una misión: darle a cada VZORIANO su personaje para la Karting Cup.</p>
<div class="buttonline"><button class="btn" onclick="show('vote')">Ir a mi papeleta</button></div><p class="muted">¿Quién tiene alma de Bowser? ¿Quién vive tan relajado como Funky Kong? ¿Y quién sorprende a todos como Luigi? Tú decides cómo se arma nuestra parrilla.</p>
<div class="event-facts"><div class="event-fact"><small>Cuándo</small><strong><a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=VZOR%C2%AE+Karting+Cup+2026&dates=20261218T103000%2F20261218T160000&ctz=America%2FSantiago&location=GoKarts.cl%2C+Calle+Valenzuela+Puelma+9500%2C+Santiago&details=VZOR%C2%AE+Karting+Cup+2026.+Ubicaci%C3%B3n%3A+https%3A%2F%2Fwww.google.com%2Fmaps%2Fplace%2FGoKarts%2F%40-33.4314691%2C-70.5320792%2C17z%2Fdata%3D%213m1%214b1%214m6%213m5%211s0x9662ce7927d0ae45%3A0x6ecd0b5e815d4aa2%218m2%213d-33.4314736%214d-70.5295043%2116s%252Fg%252F11ckx_bjnd%215m1%211e4%3Fentry%3Dttu" target="_blank" rel="noopener">Viernes 18 de diciembre</a></strong><small>2026, 10:30 a 16:00 hrs</small></div><div class="event-fact"><small>Dónde</small><strong>GoKarts.cl</strong><small><a href="https://www.google.com/maps/place/GoKarts/@-33.4314691,-70.5320792,17z/data=!3m1!4b1!4m6!3m5!1s0x9662ce7927d0ae45:0x6ecd0b5e815d4aa2!8m2!3d-33.4314736!4d-70.5295043!16s%2Fg%2F11ckx_bjnd!5m1!1e4?entry=ttu" target="_blank" rel="noopener">Calle Valenzuela Puelma 9500, Santiago</a></small></div></div>
<button type="button" class="access-poster-button" onclick="showInvitation()">Ver invitación del evento</button></div><picture class="briefing-picture"><img class="briefing-art" src="assets/karting-vzor-pasto-horizontal.png" alt="Vista cenital de una curva de karting con el isotipo VZOR formado en el pasto" width="1536" height="1024"></picture></div>
<h3 class="briefing-title">Instrucciones para pilotos</h3>
<ol class="access-steps"><li><span><b>Ya ingresaste con tu código personal.</b> Puedes volver cada vez que quieras.</span></li>
<li><span><b>Elige a un compañero.</b> Se abrirá un modal con 25 personajes; no podrás asignarte uno a ti mismo.</span></li>
<li><span><b>Arma tu parrilla.</b> Asigna 18 personajes diferentes. Los ocupados quedan atenuados dentro del modal.</span></li>
<li><span><b>Vuelve cuando quieras.</b> Consulta tu Top 3 personal y modifica tu papeleta hasta tres veces tras el envío inicial.</span></li></ol>`}
function renderAccess(){
 const node=document.getElementById('access');
 if(currentUser!==null){
  node.innerHTML=eventBriefing();
  return;
 }
 node.innerHTML=`<div class="panel access-login"><img class="access-logo" src="assets/brand/vzor-color.png" alt="VZOR" width="1200" height="301"><h2>Acceso a la parrilla</h2>
 <p class="muted">Ingresa tu código personal para continuar.</p>
 <label for="code">Tu código de piloto</label>
 <input id="code" class="field" autocomplete="off" placeholder="Ingresa tu código individual" aria-describedby="access-error" aria-required="true" onkeydown="if(event.key==='Enter')login()">
 <div id="access-error" class="error" aria-live="polite"></div>
 <button class="btn" id="login-button" onclick="login()">Entrar a la pista</button>
 <p class="input-help">Tu código es personal. Puedes ingresar cuantas veces quieras.</p></div>`;
}
async function login(){const input=document.getElementById('code'),button=document.getElementById('login-button'),error=document.getElementById('access-error');error.textContent='';input.removeAttribute('aria-invalid');const submitted=input.value.trim();if(!submitted)return error.textContent='Ingresa tu código individual.';button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='Validando código…';try{const data=await api('login',{code:submitted});code=submitted;syncParticipants(data);state=data;currentUser=data.participant;draft={};editing=!data.record;show('access')}catch(e){error.textContent=e.message;input.setAttribute('aria-invalid','true')}finally{button.disabled=false;button.removeAttribute('aria-busy');button.textContent='Entrar a la pista'}}
function showInvitation(){if(currentUser===null)return;document.getElementById('invitation-root').innerHTML=`<div class="access-invite-dialog" onclick="if(event.target===this)hideInvitation()"><div class="invite-wrap" role="dialog" aria-modal="true" aria-label="Invitación del evento"><button class="btn secondary invite-close" onclick="hideInvitation()"> Cerrar</button><img class="access-invite" src="assets/invitacion-navidad-vzor-2026.png" alt="Invitación Navidad VZOR 2026"></div></div>`}
function hideInvitation(){document.getElementById('invitation-root').innerHTML=''}
function colleagues(){return PARTICIPANTS.map((name,id)=>({name,id})).filter(p=>p.id!==currentUser)}
function isComplete(values){const pairs=Object.entries(values);const valid=new Set(colleagues().map(p=>String(p.id)));return pairs.length===18&&pairs.every(([p,c])=>valid.has(p)&&Number.isInteger(c)&&c>=0&&c<25)&&new Set(pairs.map(([,c])=>c)).size===18}
function provisionalPanel(){const p=state?.provisional;if(!p)return `<section class="panel provisional-panel" id="own-provisional"><h3>Tu personaje provisional</h3><p class="muted">Todavía no hay una asignación disponible. Actualiza cuando haya papeletas registradas.</p></section>`;return `<section class="panel provisional-panel" id="own-provisional"><div class="provisional-art">${art(p.char)}</div><div><h3>${state.closed?'Tu personaje final':'Tu personaje provisional'}</h3><h2>${esc(CHARACTERS[p.char][0])}</h2><p>${esc(CHARACTERS[p.char][3])}</p><p class="muted">${state.closed?'Asignación final con la votación cerrada.':'Si la votación cerrara ahora, este sería tu personaje exclusivo. Puede cambiar al entrar o actualizarse las papeletas.'}</p>${p.votes===0?'<p class="muted">Esta asignación no tiene votos directos; resulta de la distribución exclusiva del equipo.</p>':''}</div></section>`}
function ownTopPanel(){const top=state?.top||[],sub=state?.submitted_count||0;return `<details class="panel top-panel" id="own-top"><summary>Información complementaria: tus 3 más votados</summary><div class="flex"><div><p class="muted">Los personajes que más VZORIANOS te han asignado hasta ahora.</p></div><span class="pill">${sub} papeletas registradas</span></div>${!top.length?`<div class="notice">Todavía no has recibido asignaciones. Vuelve a consultar más adelante.</div>`:`<div class="rank-list">${top.map((x,i)=>`<div class="rank-item"><span class="pill">#${i+1}</span><div class="big">${art(x.char)}</div><strong>${esc(CHARACTERS[x.char][0])}</strong><small>${x.votes} ${x.votes===1?'voto':'votos'}</small></div>`).join('')}</div><p class="muted">Este ranking es provisional y no muestra quién hizo cada elección.</p>`}</details>`}
function startEdit(){if(!state?.record||state.closed||state.record.updates>=updateLimit())return;draft={...state.record.assignments};editing=true;renderVote()}
function cancelEdit(){draft={};editing=false;renderVote()}
function renderVote(){const node=document.getElementById('vote');if(currentUser===null){node.innerHTML=`<div class="panel center"><h2>Ingresa con tu código para comenzar</h2><button class="btn" onclick="show('access')">Ir al acceso</button></div>`;return}
const rec=state.record,available=rec?(rec.max_updates??MAX_UPDATES)-rec.updates:MAX_UPDATES;let html=`<div class="flex"><div><p class="muted">Tu papeleta</p><h2>${esc(PARTICIPANTS[currentUser])}</h2></div><span class="pill">${state.closed?'Votación cerrada':rec?'Papeleta registrada':'Pendiente de votación'}</span></div><div class="buttonline"><button class="btn secondary" onclick="refreshProfile()">Actualizar mi personaje</button><span class="muted">${available} actualizaciones disponibles</span></div>`;html+=provisionalPanel()+ownTopPanel();
if(rec&&(!editing||state.closed)){html+=`<div class="panel"><h3>Tu papeleta actual</h3><p class="muted">Puedes consultar tu Top 3 las veces que quieras. Actualizaciones utilizadas: ${rec.updates} de ${rec.max_updates??MAX_UPDATES}.</p><div class="people">${colleagues().map(p=>{const ch=rec.assignments[p.id];return `<div class="person"><span class="avatar">${art(ch)}</span><span class="info"><b>${esc(p.name)}</b><small class="character-name">${esc(CHARACTERS[ch][0])}</small><span class="character-description">${esc(CHARACTERS[ch][3])}</span></span><span class="check"></span></div>`}).join('')}</div><div class="buttonline"><button class="btn" ${available===0||state.closed?'disabled':''} onclick="startEdit()">${state.closed?'Votación cerrada':available===0?'Sin actualizaciones':'Actualizar mi papeleta'}</button></div></div>`}
else if(state.closed){html+=`<div class="panel">La votación está cerrada. Puedes seguir consultando tu Top 3.</div>`}
else{const done=Object.keys(draft).length;html+=`<div class="panel"><div class="flex"><div><h3>${rec?'Edita tu parrilla':'Arma tu parrilla'}</h3><p class="muted">Toca a un compañero para abrir el modal con los personajes. Nadie viene preseleccionado.</p></div><span class="pill">${done}/18</span></div><div class="progress" style="margin:var(--space-md) 0"><div style="width:${done/18*100}%"></div></div><div class="people">${colleagues().map(p=>{const ch=draft[p.id];return `<button class="person" onclick="openModal(${p.id})"><span class="avatar">${ch===undefined?esc(p.name.charAt(0)):art(ch)}</span><span class="info"><b>${esc(p.name)}</b><small class="${ch===undefined?'':'character-name'}">${ch===undefined?'Sin personaje asignado':esc(CHARACTERS[ch][0])}</small>${ch===undefined?'':`<span class="character-description">${esc(CHARACTERS[ch][3])}</span>`}</span><span class="action">${ch===undefined?'Elegir':'Cambiar'}</span></button>`}).join('')}</div></div><div class="buttonline">${rec?'<button class="btn secondary" onclick="cancelEdit()">Cancelar edición</button>':'<button class="btn secondary" onclick="logout()">Salir sin enviar</button>'}<button class="btn" id="save-button" onclick="submit()" ${isComplete(draft)?'':'disabled'}>${rec?'Guardar actualización':'Enviar papeleta'}</button></div><p class="muted">Cada papeleta usa 18 personajes distintos de los 25 disponibles.</p>`}
node.innerHTML=html}
async function refreshProfile(){try{state=await api('login',{code});syncParticipants(state);renderVote();document.getElementById('own-provisional').scrollIntoView({block:'start'})}catch(e){alert(e.message)}}
function openModal(person){if(!editing||person===currentUser||state.closed)return;modalPerson=person;priorFocus=document.activeElement;const current=draft[person],used=new Set(Object.entries(draft).filter(([p])=>Number(p)!==person).map(([,c])=>c));const cards=CHARACTERS.map((c,i)=>{const disabled=used.has(i),chosen=current===i;return `<button type="button" class="character ${disabled?'used':''} ${chosen?'chosen':''}" ${disabled?'disabled':''} onclick="choose(${i})"><span class="art">${art(i)}</span><b>${esc(c[0])}</b><small>${esc(c[3])}</small><em>${disabled?'Ocupado':chosen?'Asignado':''}</em></button>`}).join('');document.getElementById('modal-root').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><div class="muted">Selección de personaje</div><h2 id="modal-title">${esc(PARTICIPANTS[person])}</h2></div><button class="btn secondary" id="close-picker" aria-label="Cerrar selector de personajes" onclick="closeModal()">Cerrar</button></div><div class="modal-sub">${25-used.size} personajes disponibles. Los ocupados están atenuados.</div><div class="modal-scroller"><div class="characters">${cards}</div>${current!==undefined?`<div class="buttonline"><button class="btn ghost" onclick="unassign(${person})">Quitar asignación</button></div>`:''}</div></div></div>`;document.body.classList.add('modal-open');document.getElementById('close-picker').focus()}
function closeModal(){modalPerson=null;document.getElementById('modal-root').innerHTML='';document.body.classList.remove('modal-open');if(priorFocus&&document.contains(priorFocus))priorFocus.focus();priorFocus=null}
function choose(character){if(modalPerson===null)return;const p=modalPerson;if(Object.entries(draft).some(([id,ch])=>Number(id)!==p&&ch===character))return;draft[p]=character;closeModal();renderVote()}
function unassign(p){delete draft[p];closeModal();renderVote()}
async function submit(){if(currentUser===null||!editing||!isComplete(draft))return alert('Asigna 18 personajes distintos.');if(!confirm('¿Confirmas guardar tu papeleta? El envío inicial es gratuito y luego tendrás hasta 3 actualizaciones.'))return;const btn=document.getElementById('save-button');if(btn)btn.disabled=true;try{const r=await api('submit',{code,assignments:draft});state=r;editing=false;draft={};renderVote()}catch(e){alert(e.message);if(btn)btn.disabled=false}}
function logout(){code='';currentUser=null;draft={};editing=false;state=null;admin=false;adminKey='';adminEmail='';finalData=null;show('access')}
function renderResults(){let count=admin&&finalData?finalData.submitted_count:(state?.submitted_count??null);const box=document.getElementById('results');let html=`<h2> Control de carrera</h2><div class="stats"><div class="stat"><strong>${count===null?'—':count}</strong><small>Papeletas</small></div><div class="stat"><strong>${count===null?'—':Math.round(count/19*100)+'%'}</strong><small>Participación</small></div><div class="stat"><strong>25</strong><small>Personajes</small></div></div>${count===null?'':`<div class="progress" style="margin:var(--space-md) 0 var(--space-lg)"><div style="width:${count/19*100}%"></div></div>`}`;
if(!admin){html+=`<button class="btn" onclick="openAdminAccess()">Acceso de administración</button>`}
else{html+=`<div class="panel"><div class="flex"><h3>Administración</h3><button class="btn secondary" onclick="exitAdmin()">Salir de administración</button></div><p class="muted">El resultado final se calcula con las versiones vigentes de las papeletas. Cierra las votaciones antes de revelar la parrilla.</p><div class="buttonline"><button class="btn" onclick="adminLoad()">Actualizar resultados</button><button class="btn warn" onclick="changeClosed(${!finalData?.closed})">${finalData?.closed?'Reabrir votación':'Cerrar votación'}</button></div></div>`;
if(finalData){html+=`<div class="panel"><h3>Estado: ${finalData.closed?'CERRADO':'ABIERTO'}</h3><p class="muted">${finalData.submitted_count} de 19 papeletas.</p>${finalData.closed?`<h3>Parrilla final</h3><div style="overflow-x:auto"><table class="results"><thead><tr><th>Participante</th><th>Personaje</th><th>Votos</th></tr></thead><tbody>${finalData.assignments.map(x=>`<tr><td>${esc(PARTICIPANTS[x.person])}</td><td>${esc(CHARACTERS[x.character][0])}</td><td>${x.votes}</td></tr>`).join('')}</tbody></table></div><div class="buttonline"><button class="btn" onclick="exportCSV()">Exportar CSV</button></div>`:`<div class="notice">Los ganadores permanecen ocultos hasta que cierres la votación. Todavía no hay listado final.</div>`}</div>`}}
if(admin&&finalData){html+=`<div class="panel"><h3> Gestión de participantes y papeletas</h3><p class="muted">Los códigos existentes no pueden visualizarse: por seguridad solo se pueden regenerar. Los nuevos códigos se muestran una única vez al administrador. Restablecer elimina todos los votos de la papeleta seleccionada; conceder una actualización adicional conserva sus votos.</p><div style="overflow-x:auto"><table class="results participant-table"><thead><tr><th>Piloto</th><th>Envíos</th><th>Operaciones</th></tr></thead><tbody>${(finalData.participants||PARTICIPANTS).map((name,i)=>{const info=finalData.participant_status?.[i]||{};return `<tr><td data-label="Piloto"><strong>${esc(name)}</strong><br><small class="muted">Piloto ${i+1}</small></td><td data-label="Envíos">${info.submitted?'Enviada: '+info.updates+'/'+info.max_updates+' actualizaciones':'Sin papeleta'}</td><td data-label="Operaciones"><div class="buttonline"><button class="btn secondary" onclick="renameParticipant(${i})">Editar nombre</button><button class="btn secondary" onclick="rotateCode(${i})">Nuevo código</button><button class="btn secondary" ${info.submitted?'':'disabled'} onclick="grantUpdate(${i})">+1 actualización</button><button class="btn warn" ${info.submitted?'':'disabled'} onclick="resetBallot(${i})">Restablecer</button></div></td></tr>`}).join('')}</tbody></table></div><div class="notice">Al cambiar el nombre de un piloto, se conserva su ID y la totalidad de los votos. El acceso administrado requiere una clave secreta configurada en el servidor.</div></div>`}
box.innerHTML=html}
let adminAttempt=0;
function openAdminAccess(){
 let dialog=document.getElementById('admin-access-dialog');
 if(!dialog){dialog=document.createElement('dialog');dialog.id='admin-access-dialog';dialog.className='code-request-dialog';dialog.setAttribute('aria-labelledby','admin-access-title');dialog.innerHTML=`<div><p class="muted">VZOR® KARTING CUP 2026</p><div class="code-request-header"><h2 id="admin-access-title">Acceso de administración</h2><button type="button" class="btn secondary" onclick="closeAdminAccess()">Cerrar</button></div><p class="muted">Ingresa tu correo autorizado y tu código de administración para gestionar la votación y los correos.</p><form id="admin-access-form"><label for="admin-email">Correo de administración</label><input class="field" id="admin-email" name="email" type="email" autocomplete="username" placeholder="tu.correo@vzorsuite.com" required><label for="admin-code" style="display:block;margin-top:20px">Código de administración</label><input class="field" id="admin-code" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu código de administración" required><p id="admin-access-error" role="alert" style="color:#a02020"></p><button class="btn" id="admin-access-submit" type="submit">Entrar a administración</button></form><p class="muted" style="font-size:14px;margin-top:20px">Los envíos son manuales: revisa los destinatarios y confirma cada envío desde el panel.</p></div>`;document.body.append(dialog);
 dialog.addEventListener('cancel',e=>{e.preventDefault();closeAdminAccess()});
 dialog.addEventListener('close',()=>{adminAttempt++;dialog.querySelector('form').reset();dialog.querySelector('#admin-access-error').textContent='';dialog.querySelector('#admin-access-submit').disabled=false});
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeAdminAccess()}});
 }
 if(dialog.open)return;
 history.pushState({adminAccess:true},'',location.pathname+location.search+'#administracion');dialog.showModal();dialog.querySelector('#admin-email').focus();
}
function closeAdminAccess(){adminAttempt++;document.getElementById('admin-access-dialog')?.close();if(location.hash==='#administracion')history.back()}
function exitAdmin(){adminAttempt++;admin=false;adminKey='';adminEmail='';finalData=null;document.getElementById('admin-access-dialog')?.close();document.getElementById('results').replaceChildren();show('access');if(location.hash==='#administracion')history.back()}
window.addEventListener('popstate',()=>{if(location.hash!=='#administracion'){if(admin)exitAdmin();else document.getElementById('admin-access-dialog')?.close()}});
document.addEventListener('submit',e=>{if(e.target.id==='admin-access-form'){e.preventDefault();adminLogin()}});
async function adminLogin(){const email=document.getElementById('admin-email'),key=document.getElementById('admin-code'),error=document.getElementById('admin-access-error'),button=document.getElementById('admin-access-submit');if(!email||!key)return;const attempt=++adminAttempt,loginEmail=email.value.trim().toLowerCase(),loginKey=key.value;button.disabled=true;error.textContent='';try{const data=await api('admin',{admin_key:loginKey,admin_email:loginEmail});if(attempt!==adminAttempt)return;finalData=data;adminKey=loginKey;adminEmail=loginEmail;syncParticipants(finalData);admin=true;key.value='';document.getElementById('admin-access-dialog').close();show('results')}catch(e){if(attempt!==adminAttempt)return;adminKey='';adminEmail='';key.value='';error.textContent=e.message;button.disabled=false}}
async function adminLoad(){try{finalData=await api('admin',{admin_key:adminKey,admin_email:adminEmail});syncParticipants(finalData);renderResults()}catch(e){alert(e.message)}}
async function changeClosed(closed){if(!confirm(closed?'¿Cerrar la votación y bloquear nuevos envíos?':'¿Reabrir la votación?'))return;try{finalData=await api('admin',{admin_key:adminKey,admin_email:adminEmail,set_closed:closed});syncParticipants(finalData);renderResults()}catch(e){alert(e.message)}}
async function adminOperation(operation,participant_id,extras={}){
 try{const result=await api('admin',{admin_key:adminKey,admin_email:adminEmail,operation,participant_id,...extras});syncParticipants(result);finalData=result;renderResults();return result}
 catch(e){alert(e.message);return null}
}
async function renameParticipant(id){const name=prompt('Nuevo nombre para '+PARTICIPANTS[id]+':',PARTICIPANTS[id]);if(name===null)return;const value=name.trim();if(!value||value.length>100)return alert('Ingresa un nombre válido (máximo 100 caracteres).');if(!confirm('¿Cambiar el nombre sin alterar las votaciones de esta persona?'))return;await adminOperation('rename',id,{new_name:value})}
async function rotateCode(id){if(!confirm('¿Revocar el código actual de '+PARTICIPANTS[id]+' y emitir uno nuevo? El anterior dejará de funcionar inmediatamente.'))return;const r=await adminOperation('rotate_code',id);if(r?.new_code){const text='CÓDIGO NUEVO PARA '+PARTICIPANTS[id]+': '+r.new_code+'\n\nCopia este código ahora: no se mostrará nuevamente.';alert(text);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(r.new_code).catch(()=>{})}}
async function grantUpdate(id){if(!confirm('¿Conceder una actualización adicional a '+PARTICIPANTS[id]+' sin borrar sus votos?'))return;await adminOperation('grant_update',id)}
async function resetBallot(id){const check=prompt('Se eliminarán los votos actuales de '+PARTICIPANTS[id]+'. Escribe RESTABLECER para confirmar:');if(check!=='RESTABLECER')return;await adminOperation('reset_ballot',id)}
function exportCSV(){if(!finalData?.closed)return;const rows=[['Participante','Personaje','Votos'],...finalData.assignments.map(x=>[PARTICIPANTS[x.person],CHARACTERS[x.character][0],x.votes])];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='VZOR-Karting-Cup-2026-Resultados.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Tab'){const overlay=document.querySelector('.access-invite-dialog,.modal-overlay');if(overlay){const targets=[...overlay.querySelectorAll('button:not(:disabled),[href],input:not(:disabled),[tabindex="0"]')];const first=targets[0],last=targets[targets.length-1];if(e.shiftKey&&(document.activeElement===first||!overlay.contains(document.activeElement))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&(document.activeElement===last||!overlay.contains(document.activeElement))){e.preventDefault();first?.focus()}}}if(e.key==='Escape'){if(document.getElementById('invitation-root').innerHTML)hideInvitation();else if(modalPerson!==null)closeModal()}});
show('access');
</script></body></html>
